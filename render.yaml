services:
  - type: web
    name: nexago-relay
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/relay.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_RELAY_BASE
        value: https://thanexsago.com
